<section>
<h2>اليوم 1: الخطة والحالة: أعد الحساب قبل أن تصدّق الصياغة</h2>
<ol>
<li><p>في تقرير حالة صاغه المساعد لمشروع تجديد قاعة الاجتماعات: «اكتمل الدهان، ونسبة إنجاز المشروع 70%». عندك عشر دقائق قبل أن يُرسل التقرير إلى صاحب القرار. ما أول ما تفتحه؟</p><ul><li><b>أ.</b> المساعد نفسه، وتسأله هل هو متأكد من النسبة التي كتبها</li><li><b>ب.</b> الخطة المعتمدة، لترى هل كان الدهان مجدولًا قبل اليوم</li><li><b>ج.</b> بيانات المهام وقواعد الحالة: هل وُقّع محضر القبول؟</li><li><b>د.</b> رسالة مسؤول الدهان التي أبلغ فيها بنسبة 100%</li></ul></li>
<li><p>أرسل إليك زميل مقارنة أسعار أثاث مكتبي صاغها المساعد، وطلب أن ترفعها إلى مسؤولة المشتريات اليوم. الجدول مرتب وفيه إجمالي لكل عرض. فتحت عرضًا واحدًا فوجدت أن إجماليه في الجدول لا يطابق العرض. ما التصرف الصحيح؟</p><ul><li><b>أ.</b> تعيد حساب كل العروض من ملفاتها، وتفصح عمّا صححته</li><li><b>ب.</b> تصحح إجمالي ذلك العرض وحده، وترفع الجدول كما هو</li><li><b>ج.</b> ترفعه كما وصلك، وتكتب في الرسالة أن المساعد صاغه</li><li><b>د.</b> تعيده إلى المساعد، وتطلب منه أن يراجع حساباته كلها</li></ul></li>
<li><p>في خطة مشروع آخر: مهمة «تدريب الفريق» مدتها 4 أيام وسابقتها «التشغيل التجريبي» الذي ينتهي في اليوم 60. وصلتك مسودة من المساعد جعلت سابقة التدريب «توقيع العقد» الذي ينتهي في اليوم 20. المسودة لم تغيّر أي مدة. ماذا تتوقع؟</p><ul><li><b>أ.</b> لا يتغير أي تاريخ، لأن المدد كلها بقيت كما هي</li><li><b>ب.</b> يتأخر التدريب وما بعده، فيطول المشروع على الورق</li><li><b>ج.</b> يرفض برنامج الجدولة الخطة، لأن فيها ترابطًا خاطئًا</li><li><b>د.</b> يبدأ التدريب في اليوم 20، وقد يتغير المسار الحرج</li></ul></li>
<li><p>مشروع صغير بقواعد المركز نفسها. حتى يوم الحالة كان يجب أن تنتهي مهام أوزانها 10 و20 و10. وُقّع محضر قبول الأولى والثانية. الثالثة أبلغ مسؤولها بنسبة 95% ولم تُقبل بعد. ما مؤشر الجدول ولون الحالة؟</p><ul><li><b>أ.</b> 0.99، أخضر</li><li><b>ب.</b> 0.75، أحمر</li><li><b>ج.</b> 0.67، أحمر</li><li><b>د.</b> 0.75، أصفر</li></ul></li>
<li><p>في محضر صاغه المساعد: «إجراء: تحديث عقد الصيانة. المسؤول: مدير العقود. الموعد: الأحد القادم». في تفريغ الاجتماع قال مدير العقود: «هذا يحتاج إلى من يتولاه، وليس عندي من يتفرغ له الآن»، ولم يُذكر موعد. كيف يُسجَّل البند؟</p><ul><li><b>أ.</b> كما في المحضر، لأن مدير العقود صاحب الاختصاص في العقود</li><li><b>ب.</b> بلا مسؤول وبلا موعد، مع وقت الجملة في التفريغ</li><li><b>ج.</b> باسم مدير العقود مسؤولًا عنه، مع حذف الموعد وحده</li><li><b>د.</b> لا يُسجَّل، لأن بندًا بلا مسؤول ولا موعد غير مكتمل</li></ul></li>
<li><p>في مقارنة أسعار صاغها المساعد لتوريد كراسٍ مكتبية ثلاثة عروض بإجمالي 18,200 و19,550 و17,400 ريال، وتوصية بالثالث. فتحت العرض الثالث فوجدت: «الأسعار لا تشمل ضريبة القيمة المضافة». ما الذي تفعله قبل أي شيء آخر؟</p><ul><li><b>أ.</b> تضيف الضريبة إلى إجمالي العرض الثالث وتعيد ترتيب العروض</li><li><b>ب.</b> تسأل المساعد هل أضاف الضريبة إلى العروض الثلاثة كلها</li><li><b>ج.</b> تعيد حساب العروض الثلاثة من ملفاتها، خانة خانة</li><li><b>د.</b> ترفع المقارنة مع ملاحظة أن العرض الثالث يحتاج إلى مراجعة</li></ul></li>
<li><p>قاعدة الجهة: «تُحتسب المهمة منجزة إذا وُقّع محضر قبولها». تقرير صاغه المساعد يقول: «اكتملت أعمال التمديدات». في بيانات المهام: النسبة المبلَّغ بها 100%، ومحضر القبول غير موقَّع. ما نوع الخطأ، وما يحسمه؟</p><ul><li><b>أ.</b> تاريخ مختلَق، ويحسمه الجدول الزمني المعتمد للمشروع</li><li><b>ب.</b> لا خطأ في العبارة، لأن مسؤول المهمة أبلغ بنسبة 100%</li><li><b>ج.</b> مجموع خاطئ، وتحسمه إعادة جمع النسب المبلَّغ بها</li><li><b>د.</b> حالة مبالغ فيها، وتحسمها بيانات المهام مع القاعدة</li></ul></li>
<li><p>في ملخص خطة: «يبدأ اختبار النظام فور انتهاء التركيب». في الميثاق: «لا يبدأ الاختبار قبل اكتمال التركيب ووصول شهادة المعايرة من المورّد». ما الذي سقط من الملخص، وما أثره المحتمل؟</p><ul><li><b>أ.</b> ترابط، فقد يبدو تاريخ الانتهاء أبكر مما هو</li><li><b>ب.</b> تاريخ وصول الشهادة، ولا أثر له في حساب المدة</li><li><b>ج.</b> مسؤول، فيجب تسمية صاحب شهادة المعايرة في الخطة</li><li><b>د.</b> تفصيل يجوز اختصاره، فالملخص لا يذكر كل شرط</li></ul></li>
<li><p>مهمة «التركيب» مدتها 6 أيام عمل، وسابقتاها «التوريد» وتنتهي في اليوم 40، و«تجهيز الموقع» وتنتهي في اليوم 25. الأيام تُعدّ من الصفر. متى تنتهي «التركيب»؟</p><ul><li><b>أ.</b> في اليوم 31</li><li><b>ب.</b> في اليوم 46</li><li><b>ج.</b> في اليوم 71</li><li><b>د.</b> في اليوم 40</li></ul></li>
<li><p>خطة مدتها 20 يوم عمل تبدأ يوم أحد، وعطلة الأسبوع الجمعة والسبت، وفي تقويم الجهة ثلاثة أيام عمل لا عمل فيها خلال المدة. المساعد كتب تاريخ انتهاء حسبه دون هذه الأيام الثلاثة. ما الصحيح؟</p><ul><li><b>أ.</b> تاريخ المساعد صحيح، لأن المدة مكتوبة بأيام العمل لا بالأيام</li><li><b>ب.</b> التاريخ الصحيح قبل تاريخ المساعد بثلاثة أيام عمل</li><li><b>ج.</b> التاريخ الصحيح بعد تاريخ المساعد بثلاثة أيام عمل</li><li><b>د.</b> لا يُعرف التاريخ الصحيح دون برنامج جدولة متخصص</li></ul></li>
<li><p>سياسة المختبر: المساعد معلّم يسأل عن الترابطات ولا يبني الجدول. أي أمر يوافق هذه السياسة؟</p><ul><li><b>أ.</b> «ابنِ لي جدولًا زمنيًّا من هذا الميثاق، ثم اشرح لي ترابطاته واحدًا واحدًا»</li><li><b>ب.</b> «اقترح لكل مهمة ما تتوقف عليه، وسأراجع اقتراحك وأعدّله»</li><li><b>ج.</b> «احسب تاريخ الانتهاء من جدولي، وأخبرني أين أخطأت»</li><li><b>د.</b> «سأكتب ما أظن أن كل مهمة تتوقف عليه، فاسألني عنه»</li></ul></li>
<li><p>في مشروع آخر: حسابك من الميثاق 64 يوم عمل، وخطة المساعد 52. مدير المشروع يسأل: «أي الرقمين أعتمد؟». ما الجواب الذي يحقق «المطابقة»؟</p><ul><li><b>أ.</b> «اعتمد 64، فقد حسبتها بنفسي من الميثاق مرتين»</li><li><b>ب.</b> «64، وهذه الفروق ومصدر كل منها»</li><li><b>ج.</b> «المتوسط 58 يومًا تقدير معقول بين الرقمين»</li><li><b>د.</b> «سأطلب من المساعد أن يعيد الحساب حتى يتفق الرقمان»</li></ul></li>
<li><p>مشارك لم يقس مهمته قبل الورشة. نفّذها اليوم بالمساعد في 25 دقيقة وكتب في بطاقته: «وفّرت نصف الوقت». ما المشكلة؟</p><ul><li><b>أ.</b> لا مشكلة، فهو يعرف من خبرته كم تأخذ المهمة منه عادة</li><li><b>ب.</b> أن 25 دقيقة مدة طويلة لمهمة تُؤدى بمساعد</li><li><b>ج.</b> لا خط أساس مقيسًا يُقارن به، ولا عدّ للأخطاء</li><li><b>د.</b> أنه استعمل مساعدًا واحدًا ولم يقارن بين مساعدين</li></ul></li>
<li><p>مهمتك المتكررة تقرير حالة أسبوعي لمشروع في جهتك، ومواده مستواها «مقيّد». المساعد المتاح في القاعة مساعد عام على الإنترنت. كيف تنفّذ المهمة مرتين في الورشة؟</p><ul><li><b>أ.</b> على مواد اصطناعية تكتبها أنت على شكل موادك</li><li><b>ب.</b> على المواد الحقيقية بعد حذف اسم الجهة من عنوان التقرير</li><li><b>ج.</b> على المواد الحقيقية كما هي، فالورشة بيئة تدريب مغلقة</li><li><b>د.</b> لا تنفّذها في الورشة، وتكتب البطاقة من الذاكرة بعدها</li></ul></li>
</ol>
</section>
<section>
<h2>اليوم 2: الاجتماعات والعروض: تتبّع إلى المصدر واحسب بالصيغة</h2>
<ol>
<li><p>خطة المساعد تنتهي يوم 11 يوليو، وحسابك من الميثاق ينتهي يوم 16 أغسطس. مدير المشروع يريد أن يرسل تاريخًا إلى راعية المشروع اليوم. ما الذي تعطيه؟</p><ul><li><b>أ.</b> تاريخ المساعد، لأنه وحده يحقق الموعد الأقصى</li><li><b>ب.</b> تاريخك، مع جدول الفروق ومصدر كل فرق</li><li><b>ج.</b> تاريخًا في منتصف المسافة بين التاريخين المحسوبين</li><li><b>د.</b> خطة جديدة تطلبها من المساعد تنتهي قبل 29 يوليو</li></ul></li>
<li><p>سجّلت اجتماعًا مع ثلاثة موردين بعد أن أعلنت التسجيل ووافق الحاضرون. انضم مورّد رابع في منتصفه. بعد الاجتماع تريد محضرًا سريعًا، وأسرع ما عندك مساعد عام بحسابك الشخصي. ما التصرف الصحيح؟</p><ul><li><b>أ.</b> تحذف أسماء الموردين من التفريغ ثم تلصقه في المساعد العام</li><li><b>ب.</b> تحذف كلام المورّد الرابع وتلخص الباقي بالمساعد المعتمد</li><li><b>ج.</b> تلخص بالمساعد المعتمد دون أن تسأل المورّد الرابع عن شيء</li><li><b>د.</b> تبلغ المورّد الرابع وتسأله، ثم تلخص بالمساعد المعتمد</li></ul></li>
<li><p>في تفريغ اجتماع مع مقاول النظافة: ممثل المقاول يقول: «نطلب زيادة السعر 5% بسبب ساعات العمل الصباحية». مسؤول العقود يرد: «لا أملك أن أقرر ذلك هنا. سأعرض الطلب على المدير المالي، والجواب في رسالة يوم الأحد». ماذا يدخل السجل؟</p><ul><li><b>أ.</b> إجراء: يعرض مسؤول العقود الطلب، والموعد الأحد</li><li><b>ب.</b> قرار: زيادة سعر العقد 5% ابتداءً من الشهر القادم</li><li><b>ج.</b> قرار: رفض الزيادة، فمسؤول العقود لا يملكها</li><li><b>د.</b> لا شيء يدخل السجل، فالطلب لم يُبتّ فيه</li></ul></li>
<li><p>قاعدة التقييم: «مدة التوريد بأيام العمل من توقيع العقد إلى وصول المعدات إلى الموقع». عرض مولّدات يقول: «مدة التوريد 20 يوم عمل من استلام الدفعة المقدمة. تُصرف الدفعة خلال 10 أيام عمل من توقيع العقد». استخرج المساعد: 20. ما الذي تكتبه؟</p><ul><li><b>أ.</b> 20، لأنها المدة التي سمّاها المورّد «مدة التوريد»</li><li><b>ب.</b> صفر، لأن العرض لم يلتزم بصيغة القاعدة</li><li><b>ج.</b> 30، مع رقم الصفحة وسطر يشرح أنها 10 ثم 20</li><li><b>د.</b> ما يقوله المساعد إذا سألته مرة ثانية</li></ul></li>
<li><p>تراجع رسالة استيضاح صاغها المساعد لزميلك، موجهة إلى المتنافسين في منافسة المولّدات. صياغتها سليمة. لكنها تذكر سعر عرض أحد المتنافسين، وتسمّي بين أعضاء اللجنة شخصًا ليس في قرار تشكيلها. ما التصرف الصحيح؟</p><ul><li><b>أ.</b> تحذف السطرين من الرسالة، ثم ترسلها إلى المتنافسين</li><li><b>ب.</b> ترفع الأمرين إلى مسؤول المشتريات قبل أن ترسل</li><li><b>ج.</b> تسأل المساعد من أين جاء بالسعر وبالاسم قبل أن ترسل</li><li><b>د.</b> ترسلها كما هي، فالصياغة سليمة والباقي تفاصيل</li></ul></li>
<li><p>خط الأساس: 50 دقيقة و3 أخطاء. التنفيذ الأول بالمساعد: 30 دقيقة و6 أخطاء. التنفيذ الثاني بعد أن فصلت الصياغة عن الحساب: 45 دقيقة وخطأ واحد. المراجع واحد في الثلاثة. ما القرار الذي تسنده الأرقام؟</p><ul><li><b>أ.</b> تعتمد طريقة التنفيذ الأول، فهي الأسرع بعشرين دقيقة</li><li><b>ب.</b> تعود إلى الطريقة القديمة، فالتنفيذ الثاني أبطأ من الأول</li><li><b>ج.</b> لا تقرر شيئًا حتى تجمع عشرين تنفيذًا للمهمة</li><li><b>د.</b> تعتمد طريقة التنفيذ الثاني، وتكتب أنه قياس واحد</li></ul></li>
<li><p>في تفريغ اجتماع: عند الدقيقة 4 قال المدير: «إذن نؤجل الطلب إلى الربع القادم». وعند الدقيقة 12 بعد اعتراض المالية قال: «نعدّل القرار: نطلب الآن نصف الكمية». مسودة المساعد كتبت قرارًا واحدًا: «تأجيل الطلب». ماذا يدخل سجل الإجراءات؟</p><ul><li><b>أ.</b> القراران معًا بوقتيهما، لأن كليهما قيل في الاجتماع</li><li><b>ب.</b> قرار الدقيقة 4، لأنه الأسبق وهو ما كتبه المساعد</li><li><b>ج.</b> قرار الدقيقة 12 مع وقته في التفريغ</li><li><b>د.</b> لا قرار، لأن الحاضرين اختلفوا في الاجتماع</li></ul></li>
<li><p>أُعلن التسجيل في أول اجتماع مع مقاولين ووافق الحاضرون. بعد ربع ساعة انضم مهندس من أحد المقاولين وسأل سؤالًا مهمًّا. ما الذي تفعله قبل أن يدخل سؤاله المحضر؟</p><ul><li><b>أ.</b> لا شيء، فالإعلان في أول الاجتماع يشمل كل من حضره</li><li><b>ب.</b> تحذف سؤاله وجوابه من المحضر حتى لا تُسأل عن موافقته</li><li><b>ج.</b> تبلغه بالتسجيل وتسأله، وتسجّل أنه انضم بعد الإعلان</li><li><b>د.</b> تعيد صياغة سؤاله دون اسمه بمساعد عام ثم تدخله المحضر</li></ul></li>
<li><p>في اجتماع عن صيانة المصاعد قال مدير الصيانة: «أمامنا عرضان. القرار ليس لنا، سأرفع مذكرة إلى المدير العام يوم الأحد». مسودة المساعد: «قرار: اعتماد العرض الأول». ما البند الصحيح؟</p><ul><li><b>أ.</b> إجراء: مدير الصيانة يرفع مذكرة بالعرضين، يوم الأحد</li><li><b>ب.</b> قرار: اعتماد العرض الأول، بانتظار موافقة المدير العام</li><li><b>ج.</b> تحديث خطر: تأخر القرار في العرضين إلى ما بعد الأحد</li><li><b>د.</b> لا بند في السجل، لأن الاجتماع لم يحسم أيًّا من العرضين</li></ul></li>
<li><p>سجل إجراءات فيه 24 بندًا، 22 منها لها وقت في التفريغ. البندان الباقيان كتب المساعد أنهما «مفهومان من السياق». ماذا تفعل بهما؟</p><ul><li><b>أ.</b> يبقيان في السجل، فسياق الاجتماع مصدر مقبول للبند</li><li><b>ب.</b> يبقيان مع علامة «غير مؤكد» حتى يعترض أحد الحاضرين</li><li><b>ج.</b> يخرجان من السجل إن لم تجد جملتيهما، ويُسأل صاحباهما</li><li><b>د.</b> يبقيان بعد أن يضع المساعد لكل منهما وقتًا تقريبيًّا</li></ul></li>
<li><p>ثلاثة عروض لتوريد مولّدات احتياطية. استخرج المساعد أسعارها: 820,000 و905,000 و880,000 ريال. في صفحة السعر من العرض الأول: «الأسعار لا تشمل ضريبة القيمة المضافة»، وفي الآخرين: «شاملًا الضريبة 15%». قاعدة التقييم: السعر شامل الضريبة. أي العروض أقل سعرًا؟</p><ul><li><b>أ.</b> الأول، بسعر 820,000 ريال</li><li><b>ب.</b> الثالث، بسعر 880,000 ريال</li><li><b>ج.</b> الثاني، لأنه الوحيد الواضح</li><li><b>د.</b> لا يُعرف حتى يعيد الأول عرضه</li></ul></li>
<li><p>مذكرة صاغها المساعد تذكر «المجموع الموزون: 88.0 و86.5 و85.0» لثلاثة عروض. أدخلت قيمه هو في صيغة قواعد الاحتساب فخرجت 91.20 و84.75 و89.10. ماذا تستنتج؟</p><ul><li><b>أ.</b> الفروق صغيرة والأول هو الأول، فأرقام المذكرة مقبولة</li><li><b>ب.</b> الصيغة هي الخاطئة، فالمساعد حسب بدقة أعلى من جدولك</li><li><b>ج.</b> أرقام المذكرة مكتوبة لا محسوبة، فلا تدخل المصفوفة</li><li><b>د.</b> يُطلب من المساعد أن يشرح طريقته، ثم تُقبل أرقامه</li></ul></li>
<li><p>معيار «الخبرة المماثلة» حكم من 0 إلى 5 بسلّم مكتوب. المساعد «قدّر» الدرجات الثلاث من نص العروض. ما الذي يوافق قواعد المنافسة؟</p><ul><li><b>أ.</b> تُقبل تقديراته، لأنها مبنية على نص العروض نفسه لا على رأي</li><li><b>ب.</b> يُحذف المعيار من المصفوفة، لأنه غير موضوعي بطبيعته</li><li><b>ج.</b> يُؤخذ متوسط تقدير المساعد وتقدير أحد أعضاء اللجنة</li><li><b>د.</b> يحكم عضوان من اللجنة بالسلّم، ويُكتب اسماهما وسببهما</li></ul></li>
<li><p>عضو في لجنة فحص عروض لعقد نظافة أقرّ بأن ابن عمه شريك في أحد المتنافسين، وقرر رئيس اللجنة تنحّيه. مذكرة صاغها المساعد تسمّيه بين من راجعوا العروض الفنية، وفيها أيضًا مبلغ التكلفة التقديرية للعقد. ما الذي ترفعه إلى مسؤول المشتريات؟</p><ul><li><b>أ.</b> خطأ الاسم وحده، فالمبلغ معلومة تفيد المقارنة بين العروض</li><li><b>ب.</b> الأمرين معًا: اسم المتنحي، والمبلغ الذي دخل المساعد</li><li><b>ج.</b> لا شيء، وتصحح المذكرة بنفسك قبل أن يراها غيرك</li><li><b>د.</b> المبلغ وحده، فاسم المقيّم خطأ صياغة يصححه أي مراجع</li></ul></li>
<li><p>خط الأساس: 60 دقيقة و2 من الأخطاء. التنفيذ الأول بالمساعد: 35 دقيقة و5 أخطاء. التنفيذ الثاني بعد تعديل واحد (كل رقم تخرجه صيغة): 42 دقيقة وخطأ واحد. الأخطاء عدّها الزميل نفسه. ما القراءة الأمينة؟</p><ul><li><b>أ.</b> التنفيذ الأول أفضل الثلاثة، لأنه أسرعها بفارق واضح</li><li><b>ب.</b> التعديل فشل، لأن التنفيذ الثاني أبطأ من الأول بسبع دقائق</li><li><b>ج.</b> لا حكم ممكن، لأن الأرقام الثلاثة تشير إلى اتجاهات مختلفة</li><li><b>د.</b> التنفيذ الثاني أسرع من الأساس وأقل أخطاء منه</li></ul></li>
<li><p>عدّ زميلك أخطاء خط الأساس والتنفيذ الأول. في اليوم الثاني غاب، فعدّ زميل آخر أخطاء التنفيذ الثاني ووجد صفرًا. ما الذي تفعله قبل أن تكتب المقارنة؟</p><ul><li><b>أ.</b> تكتب الصفر كما هو، فالعدّ عدّ أيًّا كان من قام به</li><li><b>ب.</b> يعيد الزميل الجديد عدّ الصفين الأولين أيضًا</li><li><b>ج.</b> تعدّ أخطاء التنفيذ الثاني بنفسك لتتأكد من الصفر</li><li><b>د.</b> تحذف عمود الأخطاء وتقارن الصفوف الثلاثة بالدقائق</li></ul></li>
</ol>
